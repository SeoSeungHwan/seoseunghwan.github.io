<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>집들이 메뉴판</title>
    <meta
      name="description"
      content="QR로 열어보는 집들이 음료와 술 메뉴판"
    />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="집들이 메뉴판" />
    <meta property="og:title" content="오늘의 집들이 메뉴판" />
    <meta
      property="og:description"
      content="음료와 술 메뉴를 한눈에 보는 우리 집 집들이 메뉴판"
    />
    <meta property="og:url" content="https://seoseunghwan.github.io/" />
    <meta
      property="og:image"
      content="https://seoseunghwan.github.io/og-image.svg"
    />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="오늘의 집들이 메뉴판" />
    <meta
      name="twitter:description"
      content="음료와 술 메뉴를 한눈에 보는 우리 집 집들이 메뉴판"
    />
    <meta
      name="twitter:image"
      content="https://seoseunghwan.github.io/og-image.svg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="og-image.svg" type="image/svg+xml" />
  </head>
  <body>
    <main class="page">
      <section class="poster">
        <span class="tape tape-left" aria-hidden="true"></span>
        <span class="tape tape-right" aria-hidden="true"></span>

        <header class="poster-header">
          <p class="poster-kicker">House Warming Menu</p>
          <h1><span>오늘의 집들이</span> <span>메뉴판</span></h1>
          <p class="poster-copy">
            마시고 싶은 메뉴를 골라서 말해주세요. 천천히 준비해드릴게요.
          </p>
        </header>

        <section class="best-section" aria-labelledby="best-title">
          <div class="section-intro">
            <h2 id="best-title">Best</h2>
            <p>오늘 추천하는 메뉴</p>
          </div>
          <div id="best-grid" class="best-grid"></div>
        </section>

        <div class="divider" aria-hidden="true"></div>

        <section class="menu-columns" aria-label="전체 메뉴">
          <section class="menu-group">
            <div class="group-head">
              <h2>Drink</h2>
              <p>음료</p>
            </div>
            <ul id="drink-list" class="menu-list"></ul>
          </section>

          <section class="menu-group">
            <div class="group-head">
              <h2>Alcohol</h2>
              <p>술</p>
            </div>
            <ul id="alcohol-list" class="menu-list"></ul>
          </section>
        </section>

        <footer class="poster-footer">
          <h2>Note</h2>
          <p>
            디카페인 변경, 얼음, 잔, 와인 종류는 편하게 물어봐주세요.
          </p>
        </footer>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
